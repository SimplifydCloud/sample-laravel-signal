services:
  app:
    build: .
    ports:
      - "8000:8080"
    environment:
      APP_NAME: Signal
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env first; see README}
      APP_URL: http://localhost:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/demo.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
    volumes:
      - signal-data:/var/www/html/storage
    command: ["sh", "-c", "touch storage/demo.sqlite && php artisan migrate --seed --force && chown -R www-data:www-data storage && exec apache2-foreground"]
volumes:
  signal-data:
